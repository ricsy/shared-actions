name: Repository Doctor

on:
  workflow_call:
    inputs:
      results_repository:
        description: Central repository that stores inspection issues.
        required: true
        type: string
      runner:
        description: Runner label used by all inspection jobs.
        required: false
        default: ubuntu-latest
        type: string
      node_version:
        description: Node.js version used by project commands.
        required: true
        type: string
      pnpm_version:
        description: pnpm version used by project commands.
        required: true
        type: string
      command_plan:
        description: Immutable JSON project command plan generated by repo-kit.
        required: true
        type: string
      timeout_minutes:
        description: Maximum inspect job duration.
        required: true
        type: number
      force:
        description: Run all checks even when checkpoints are current.
        required: false
        default: false
        type: boolean
    secrets:
      REPO_DOCTOR_TOKEN:
        description: Token with Issues access to the results repository.
        required: true
      COMMON_LIB_TOKEN:
        description: Token with read access to repo-kit, shared-actions, and private Git dependencies.
        required: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ${{ inputs.runner }}
    outputs:
      mode: ${{ steps.preflight.outputs.mode }}
      result: ${{ steps.preflight.outputs.result }}
      source_sha: ${{ steps.preflight.outputs.source_sha }}
      repo_kit_sha: ${{ steps.preflight.outputs.repo_kit_sha }}
      shared_actions_sha: ${{ steps.preflight.outputs.shared_actions_sha }}
    steps:
      - name: Checkout helper
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-doctor/shared-actions
          persist-credentials: false
      - name: Setup helper Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Setup helper pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/repo-doctor/pnpm-helper
      - name: Install helper dependencies
        run: pnpm --dir .repo-doctor/shared-actions install --prod --frozen-lockfile --ignore-scripts
      - name: Resolve inspection mode
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMON_LIB_TOKEN: ${{ secrets.COMMON_LIB_TOKEN }}
          REPO_DOCTOR_TOKEN: ${{ secrets.REPO_DOCTOR_TOKEN }}
          REPO_DOCTOR_INPUT: >-
            {"sourceRepository":"${{ github.repository }}","resultsRepository":"${{ inputs.results_repository }}","repoKitRepository":"ricsy/repo-kit","sharedActionsRepository":"${{ job.workflow_repository }}","force":${{ inputs.force }}}
        run: |
          set -euo pipefail
          result="$(printf '%s' "$REPO_DOCTOR_INPUT" | node .repo-doctor/shared-actions/scripts/repo-doctor/cli.mjs preflight)"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          node --input-type=module -e '
            const value = JSON.parse(process.argv[1]);
            console.log("mode=" + value.mode);
            console.log("source_sha=" + value.sourceSha);
            console.log("repo_kit_sha=" + value.repoKitSha);
            console.log("shared_actions_sha=" + value.sharedActionsSha);
          ' "$result" >> "$GITHUB_OUTPUT"
      - name: Explain preflight failure
        if: failure()
        run: echo 'Repo Doctor preflight failed. Verify REPO_DOCTOR_TOKEN and COMMON_LIB_TOKEN permissions.' >> "$GITHUB_STEP_SUMMARY"

  inspect:
    needs: preflight
    if: needs.preflight.outputs.mode != 'skip'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      result: ${{ steps.inspect.outputs.result }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Checkout helper
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-doctor/shared-actions
          persist-credentials: false
      - name: Checkout repo-kit
        uses: actions/checkout@v6
        with:
          repository: ricsy/repo-kit
          ref: ${{ needs.preflight.outputs.repo_kit_sha }}
          token: ${{ secrets.COMMON_LIB_TOKEN }}
          path: .repo-doctor/repo-kit
          persist-credentials: false
      - name: Setup helper Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Capture helper runtime
        id: helper-runtime
        run: echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"
      - name: Setup helper pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/repo-doctor/pnpm-helper
      - name: Install helper dependencies
        run: pnpm --dir .repo-doctor/shared-actions install --prod --frozen-lockfile --ignore-scripts
      - name: Setup project Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          package-manager-cache: false
      - name: Setup project pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm_version }}
          dest: ${{ runner.temp }}/repo-doctor/pnpm-project
      - name: Run inspection
        id: inspect
        env:
          COMMAND_PLAN: ${{ inputs.command_plan }}
          INSPECTION_MODE: ${{ needs.preflight.outputs.mode }}
          COMMAND_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          HELPER_NODE: ${{ steps.helper-runtime.outputs.node }}
          PROJECT_READ_TOKEN: ${{ secrets.COMMON_LIB_TOKEN }}
        run: |
          set -euo pipefail
          input="$(node --input-type=module -e '
            process.stdout.write(JSON.stringify({
              mode: process.env.INSPECTION_MODE,
              sourceRoot: process.env.GITHUB_WORKSPACE + "/source",
              repoKitCli: process.env.GITHUB_WORKSPACE + "/.repo-doctor/repo-kit/dist/index.mjs",
              commandTimeoutMs: Number(process.env.COMMAND_TIMEOUT_MINUTES) * 60_000,
              projectReadToken: process.env.PROJECT_READ_TOKEN,
              commandPlan: JSON.parse(process.env.COMMAND_PLAN),
            }));
          ')"
          unset PROJECT_READ_TOKEN
          result="$(printf '%s' "$input" | "$HELPER_NODE" .repo-doctor/shared-actions/scripts/repo-doctor/cli.mjs inspect)"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Enforce current inspection status
        env:
          INSPECTION_RESULT: ${{ steps.inspect.outputs.result }}
        run: node --input-type=module -e 'if (JSON.parse(process.env.INSPECTION_RESULT).status !== "passed") process.exit(1)'

  report:
    needs: [preflight, inspect]
    if: always() && needs.preflight.result == 'success' && needs.preflight.outputs.mode != 'skip'
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout helper
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-doctor/shared-actions
          persist-credentials: false
      - name: Setup helper Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Setup helper pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          dest: ${{ runner.temp }}/repo-doctor/pnpm-helper
      - name: Install helper dependencies
        run: pnpm --dir .repo-doctor/shared-actions install --prod --frozen-lockfile --ignore-scripts
      - name: Update central status
        id: report
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          REPO_DOCTOR_TOKEN: ${{ secrets.REPO_DOCTOR_TOKEN }}
          PREFLIGHT_RESULT: ${{ needs.preflight.outputs.result }}
          INSPECTION_RESULT: ${{ needs.inspect.outputs.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS_REPOSITORY: ${{ inputs.results_repository }}
        run: |
          set -euo pipefail
          input="$(node --input-type=module -e '
            const preflight = JSON.parse(process.env.PREFLIGHT_RESULT);
            let inspection;
            try {
              inspection = JSON.parse(process.env.INSPECTION_RESULT);
            } catch {
              inspection = {
                mode: preflight.mode,
                status: "incomplete",
                checks: [{
                  stage: "prepare",
                  command: "inspect",
                  status: "incomplete",
                  durationMs: 0,
                  errorCode: "INSPECTION_RESULT_MISSING",
                }],
              };
            }
            process.stdout.write(JSON.stringify({
              resultsRepository: process.env.RESULTS_REPOSITORY,
              repository: preflight.repository,
              mode: preflight.mode,
              sourceSha: preflight.sourceSha,
              repoKitSha: preflight.repoKitSha,
              sharedActionsSha: preflight.sharedActionsSha,
              previousStatus: preflight.previousStatus,
              inspection,
              run: {
                id: Number(process.env.RUN_ID),
                attempt: Number(process.env.RUN_ATTEMPT),
                url: process.env.RUN_URL,
              },
            }));
          ')"
          result="$(printf '%s' "$input" | node .repo-doctor/shared-actions/scripts/repo-doctor/cli.mjs report)"
          echo "result=$result" >> "$GITHUB_OUTPUT"
      - name: Enforce inspection status
        if: steps.report.outcome == 'success'
        env:
          REPORT_RESULT: ${{ steps.report.outputs.result }}
        run: node --input-type=module -e 'if (JSON.parse(process.env.REPORT_RESULT).overall !== "passed") process.exit(1)'
